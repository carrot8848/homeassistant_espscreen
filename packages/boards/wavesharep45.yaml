# ESP Screens - the Waveshare ESP32-P4-WIFI6-Touch-LCD-5: a 5-inch 720 x 1280 MIPI-DSI panel (HX8394) with GT911
# capacitive touch, on an ESP32-P4 with an ESP32-C6 for Wi-Fi.
# Hardware reference: https://www.waveshare.com/esp32-p4-wifi6-touch-lcd-5.htm
#
# ESPHome has no HX8394 model in its mipi_dsi platform, so the panel is `model: CUSTOM` with the init sequence and the
# timings Waveshare's own ESP-IDF BSP uses (bsp/esp32_p4_wifi6_touch_lcd_5, esp_lcd_hx8394): 720 x 1280, RGB565, two
# lanes at 700 Mbps, 58 MHz pixel clock, and a reset that is active high, which ESPHome's reset keeps low after the
# sequence unless the pin is inverted. The panel is 720 x 1280 itself (portrait); LVGL turns the picture and the touch
# together. The pins are those of the other Waveshare P4 panels: GT911 on the touch bus (GPIO7/8) with its reset on
# GPIO23, the backlight's PWM on GPIO26, and the audio wired as the Waveshare P4 86 panel
# (hardware/wavesharep4-audio.yaml). Tried on one unit: picture, touch, backlight and pages.
#
# A board file is the board's hardware, the facts the shared tree takes from it (its glass and its grid), and the
# features it has; docs/PROFILES.md says how the files of a screen fit together.
packages:
  # The ESP32-P4, its memory, the ESP32-C6 for Wi-Fi and the touch bus, pin for pin the other Waveshare P4 panels'.
  hardware: !include ../hardware/esp32p4-c6.yaml
  look: !include ../looks/standard.yaml
  touch: !include ../features/capacitive-touch.yaml
  backlight: !include ../features/backlight.yaml
  camera: !include ../features/camera.yaml
  self_test: !include ../features/self-test.yaml
  snapshot: !include ../features/snapshot.yaml
  # The speaker and the microphones are wired as on the Waveshare P4 86 panel (an ES8311 at 0x18, an ES7210 at 0x40, an
  # NS4150B amplifier on GPIO53, the same five I2S pins), so the board takes that audio. It is off here: ESPHome
  # 2026.10.2's esp_audio_stack does not compile (its CapsRingBuffer calls RingBuffer::handle_ as a member, which
  # 2026.10 made a function), and the board is tried out for its glass first. On ESPHome 2026.9.0 include the audio
  # package (../hardware/wavesharep4-audio.yaml) here and raise `esphome: min_version` below to 2026.9.0.

substitutions:
  # The key of this board file; the firmware reports it so ESP Screens knows what board a screen is.
  BOARD_ID: "wavesharep45"
  DEVICE_NAME: "wavesharep45"
  DEVICE_FRIENDLY_NAME: "My Waveshare P4 5"

  # The glass: the panel's own pixels and its density, 1469 diagonal pixels over 5.0 inches.
  PANEL_W: "720"
  PANEL_H: "1280"
  DISPLAY_DPI: "293.781"
  # The LVGL angle that lays this panel out lying down (1280 x 720). Standing up is a quarter further.
  ROTATION_LANDSCAPE: "90"
  # The tile grid: three columns by three rows lying down, and one column by five rows standing up, as on the Tab5,
  # whose glass has the same pixels and the same density.
  GRID_COLS: "3"
  GRID_ROWS: "3"
  GRID_COLS_PORTRAIT: "1"
  GRID_ROWS_PORTRAIT: "5"
  # More tiles and pages than the 64 and eight of a board without PSRAM (firmware 0.34.0+): an ESP32-P4 has the PSRAM and
  # the memory inside the chip for them, and the memory budget (tile_memory.h) says how many of them a layout really takes.
  SCREEN_MAX_TILES: "256"
  SCREEN_MAX_PAGES: "16"
  SCREEN_MAX_BAR_ITEMS: "12"                    # a wider top bar where the glass has the width for it
  LVGL_BUFFER_SIZE: "50%"                        # LVGL's draw buffer as a share of the screen, in PSRAM

  # Hardware a screen's own YAML may change (docs/EASY_SETUP.md, "Hardware-specific YAML overrides")
  BACKLIGHT_FREQUENCY: "1000Hz"                 # the backlight's PWM, as in the board's own ESPHome example

# ============================================================
# No need to edit below this line.
# ============================================================

# A board file's min_version would win over the core's. This one keeps the core's (2026.6.2): nothing here needs more.
# The audio does, on the day it is switched on above (2026.9.0).

esp32:
  flash_size: 32MB
  framework:
    advanced:
      # ESPHome asks for this ESP-IDF option for update slots on more than 16 MB of flash.
      enable_idf_experimental_features: true

# A second internal regulator at 3.3 V beside the MIPI-DSI PHY's (channel 3, in the hardware file) in bypass mode: the
# board's own ESPHome example turns it on for the peripherals in the GPIO39 to GPIO48 domain.
esp_ldo:
  - channel: 4
    voltage: passthrough

# ESPHome's own gt911 platform. The 5-inch board wires only its reset (GPIO23) and leaves its interrupt line unused.
touchscreen:
  - platform: gt911
    id: ts_touch
    display: my_display
    i2c_id: touch_bus
    reset_pin: GPIO23
    update_interval: 32ms

# The backlight, a PWM pin that is not inverted on this board (features/backlight.yaml makes it the light), at the
# full range as in Waveshare's example for this panel; zero_means_zero keeps a dark standby dark.
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO26
    frequency: ${BACKLIGHT_FREQUENCY}
    zero_means_zero: true

# ESPHome has no HX8394 model: the panel's own timings and init sequence, byte for byte as Waveshare's ESP-IDF BSP
# (esp_lcd_hx8394) sends them. The reset is active high on this board, so the pin is inverted: without that the panel
# stays held in reset and the glass is lit but black.
display:
  - platform: mipi_dsi
    id: my_display
    model: CUSTOM
    dimensions: {width: 720, height: 1280}
    reset_pin:
      number: GPIO27
      inverted: true
    color_order: RGB
    color_depth: 16
    pclk_frequency: 58MHz
    lanes: 2
    lane_bit_rate: 700Mbps
    hsync_pulse_width: 20
    hsync_back_porch: 20
    hsync_front_porch: 40
    vsync_pulse_width: 4
    vsync_back_porch: 10
    vsync_front_porch: 24
    update_interval: never
    auto_clear_enabled: false
    init_sequence:
      - [0x11]                                        # sleep out
      - delay 120ms
      - [0x36, 0x00]                                  # MADCTL: RGB order
      - [0x3A, 0x55]                                  # COLMOD, replaced by 0x3A 0x50 further down
      - [0xBA, 0x61]                                  # DSI_INT0: two data lanes
      - [0xB9, 0xFF, 0x83, 0x94]                      # set power
      - [0xB1, 0x48, 0x0A, 0x6A, 0x09, 0x33, 0x54, 0x71, 0x71, 0x2E, 0x45]
      - [0xBA, 0x61, 0x03, 0x68, 0x6B, 0xB2, 0xC0]
      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F]
      - [0xB4, 0x1C, 0x78, 0x1C, 0x78, 0x1C, 0x78, 0x01, 0x0C, 0x86, 0x75, 0x00, 0x3F, 0x1C, 0x78, 0x1C, 0x78,
        0x1C, 0x78, 0x01, 0x0C, 0x86]
      - [0xD3, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0x08, 0x32, 0x10, 0x05, 0x00, 0x05, 0x32, 0x13, 0xC1,
        0x00, 0x01, 0x32, 0x10, 0x08, 0x00, 0x00, 0x37, 0x03, 0x07, 0x07, 0x37, 0x05, 0x05, 0x37, 0x0C, 0x40]
      - [0xD5, 0x18, 0x18, 0x18, 0x18, 0x22, 0x23, 0x20, 0x21, 0x04, 0x05, 0x06, 0x07, 0x00, 0x01, 0x02, 0x03,
        0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18,
        0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x19, 0x19, 0x19, 0x19]
      - [0xD6, 0x18, 0x18, 0x19, 0x19, 0x21, 0x20, 0x23, 0x22, 0x03, 0x02, 0x01, 0x00, 0x07, 0x06, 0x05, 0x04,
        0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18,
        0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x19, 0x19, 0x18, 0x18]
      - [0xE0, 0x07, 0x08, 0x09, 0x0D, 0x10, 0x14, 0x16, 0x13, 0x24, 0x36, 0x48, 0x4A, 0x58, 0x6F, 0x76, 0x80,
        0x97, 0xA5, 0xA8, 0xB5, 0xC6, 0x62, 0x63, 0x68, 0x6F, 0x72, 0x78, 0x7F, 0x7F, 0x00, 0x02, 0x08, 0x0D,
        0x0C, 0x0E, 0x0F, 0x10, 0x24, 0x36, 0x48, 0x4A, 0x58, 0x6F, 0x78, 0x82, 0x99, 0xA4, 0xA0, 0xB1, 0xC0,
        0x5E, 0x5E, 0x64, 0x6B, 0x6C, 0x73, 0x7F, 0x7F]  # positive gamma
      - [0xCC, 0x0B]
      - [0xC0, 0x1F, 0x73]
      - [0xB6, 0x6B, 0x6B]
      - [0xD4, 0x02]
      - [0xBD, 0x01]
      - [0xB1, 0x00]
      - [0xBD, 0x00]
      - [0xBF, 0x40, 0x81, 0x50, 0x00, 0x1A, 0xFC, 0x01]
      - [0x3A, 0x50]                                  # COLMOD: RGB565, as the panel's own DPI configuration
      - [0x11]                                        # sleep out
      - delay 200ms
      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F, 0x00, 0x00, 0x00, 0x00, 0xC0, 0x18]
      - [0x29]                                        # display on
      - delay 80ms
